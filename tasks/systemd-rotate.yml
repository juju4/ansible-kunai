---
## FIXME! this will trigger on all file change meaning all the time...
## only want after rotate aka unlink/link but no such option

- name: Ensure acl package is present
  ansible.builtin.package:
    name: acl
    state: present

- name: Systemd
  when: ansible_facts['service_mgr'] == 'systemd'
  block:
    - name: Add systemd.path rotate service and path files
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        mode: '0644'
        backup: "{{ kunai_backup | default(true) }}"
      loop:
        - kunailog.service
        - kunailog.path
      notify:
        - Reload systemd
        - Restart kunailog

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    - name: Ensure kunailog.{path,service} are enabled and started
      ansible.builtin.service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - kunailog.service
        - kunailog.path
      when:
        - not is_container | bool

  rescue:
    - name: Import immutable
      ansible.builtin.import_tasks: immutable.yml
      vars:
        target_dir: /etc/systemd/system
        state: pre
    - name: Import immutable
      ansible.builtin.include_tasks: immutable.yml
      vars:
        target_dir: "/etc/systemd/system/{{ item }}"
        state: pre
      loop:
        - kunailog.service
        - kunailog.path

    - name: Add systemd.path rotate service and path files (immutable)
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        mode: '0644'
        backup: "{{ kunai_backup | default(true) }}"
      loop:
        - kunailog.service
        - kunailog.path
      notify:
        - Reload systemd
        - Restart kunailog

    - name: Flush handlers (immutable)
      ansible.builtin.meta: flush_handlers

    - name: Ensure kunailog.{path,service} are enabled and started (immutable)
      ansible.builtin.service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - kunailog.service
        - kunailog.path
      when:
        - not is_container | bool

    - name: Import immutable
      ansible.builtin.import_tasks: immutable.yml
      vars:
        target_dir: /etc/systemd/system
        state: post
    - name: Import immutable
      ansible.builtin.include_tasks: immutable.yml
      vars:
        target_dir: "/etc/systemd/system/{{ item }}"
        state: post
      loop:
        - kunailog.service
        - kunailog.path
